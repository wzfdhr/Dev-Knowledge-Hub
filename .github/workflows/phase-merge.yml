name: phase-merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number approved for merge
        required: true
        type: string
      approved_head:
        description: Reviewed 40-character pull request head SHA
        required: true
        type: string
      approved_base:
        description: Reviewed 40-character main branch base SHA
        required: true
        type: string
      user_approved:
        description: User explicitly approved this exact head
        required: true
        type: boolean
      source_blob_contract_gate_manifest:
        description: Manifest basename inside the immutable FK17 gate artifact
        required: false
        default: ""
        type: string
      source_blob_contract_gate_manifest_sha256:
        description: Reviewed SHA-256 of the exact FK17 gate manifest
        required: false
        default: ""
        type: string
      source_blob_contract_gate_artifact_run_id:
        description: Workflow run containing the immutable FK17 gate artifact bundle
        required: false
        default: ""
        type: string
      source_blob_contract_gate_artifact_name:
        description: Immutable artifact name containing the FK17 gate manifest and references
        required: false
        default: ""
        type: string

concurrency:
  group: phase-merge-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: devkh_test
          POSTGRES_USER: devkh
          POSTGRES_PASSWORD: devkh-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devkh -d devkh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://devkh:devkh-ci-password@127.0.0.1:5432/devkh_test
      DEVKH_FK17_BOOTSTRAP_COMMIT: ${{ vars.DEVKH_FK17_BOOTSTRAP_COMMIT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate approved base ancestry
        env:
          APPROVED_BASE: ${{ inputs.approved_base }}
          APPROVED_HEAD: ${{ inputs.approved_head }}
        run: git merge-base --is-ancestor "$APPROVED_BASE" "$APPROVED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Extract reviewed FK17 bootstrap verifier
        env:
          CURRENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$DEVKH_FK17_BOOTSTRAP_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$DEVKH_FK17_BOOTSTRAP_COMMIT^{commit}"
          git merge-base --is-ancestor "$DEVKH_FK17_BOOTSTRAP_COMMIT" HEAD
          test "$(git rev-parse "$DEVKH_FK17_BOOTSTRAP_COMMIT:.github/workflows/phase-merge.yml")" = \
            "$(git rev-parse "$CURRENT_WORKFLOW_SHA:.github/workflows/phase-merge.yml")"
          rm -rf /tmp/devkh-fk17-trusted
          install -d -m 0700 /tmp/devkh-fk17-trusted
          git archive "$DEVKH_FK17_BOOTSTRAP_COMMIT" | tar -x -C /tmp/devkh-fk17-trusted
      - name: Install reviewed FK17 verifier dependencies
        run: npm ci --ignore-scripts --prefix /tmp/devkh-fk17-trusted
      - run: npx playwright install --with-deps chromium
      - name: Run reviewed FK17 verifier
        env:
          DEVKH_RELEASE_CANDIDATE_ROOT: ${{ github.workspace }}
          DEVKH_FK17_TRUSTED_BOOTSTRAP_COMMIT: ${{ vars.DEVKH_FK17_BOOTSTRAP_COMMIT }}
          DEVKH_FK17_CURRENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          DEVKH_FK17_CURRENT_WORKFLOW_PATH: .github/workflows/phase-merge.yml
        run: node /tmp/devkh-fk17-trusted/scripts/release-verify.mjs --scope verify
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-merge-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  container-smoke:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    if: ${{ inputs.user_approved && github.actor == github.repository_owner }}
    env:
      POSTGRES_PASSWORD: devkh-container-password
      DEVKH_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DEVKH_SESSION_SECRET: container-smoke-session-secret-at-least-32-chars
      PUBLIC_BASE_URL: https://hub.example.test
      DEVKH_PORT: 3000
      DEVKH_DOMAIN: hub.example.test
      ACME_EMAIL: ci@example.test
      COMPOSE_PROJECT_NAME: devkh-ci-merge-${{ github.run_id }}
      DEVKH_CONTAINER_SMOKE: "true"
      RECOVERY_EVIDENCE_DIR: /tmp/devkh-recovery-evidence
      RECOVERY_EVIDENCE_DEFER_FINALIZATION: "true"
      DEVKH_SOURCE_STORAGE_MODE: shadow
      DEVKH_RELEASE_APPROVED_BASE: ${{ inputs.approved_base }}
      DEVKH_SOURCE_BLOB_CONTRACT_GATE_MANIFEST: /tmp/devkh-source-blob-contract-gate/${{ inputs.source_blob_contract_gate_manifest }}
      DEVKH_SOURCE_BLOB_CONTRACT_GATE_MANIFEST_SHA256: ${{ inputs.source_blob_contract_gate_manifest_sha256 }}
      DEVKH_SOURCE_BLOB_CONTRACT_CANDIDATE_COMMIT: ${{ inputs.approved_head }}
      DEVKH_SOURCE_BLOB_CONTRACT_EXPECTED_APPROVER: ${{ github.actor }}
      DEVKH_FK17_BOOTSTRAP_COMMIT: ${{ vars.DEVKH_FK17_BOOTSTRAP_COMMIT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate approved base ancestry
        env:
          APPROVED_BASE: ${{ inputs.approved_base }}
          APPROVED_HEAD: ${{ inputs.approved_head }}
        run: git merge-base --is-ancestor "$APPROVED_BASE" "$APPROVED_HEAD"
      - name: Detect source blob contract gate
        id: source-blob-contract
        env:
          APPROVED_BASE: ${{ inputs.approved_base }}
          APPROVED_HEAD: ${{ inputs.approved_head }}
        run: |
          set -euo pipefail
          base_contract=""
          head_contract=""
          if git cat-file -e "$APPROVED_BASE:drizzle/0035_source_blobs_contract.sql" 2>/dev/null; then
            base_contract="$(git rev-parse "$APPROVED_BASE:drizzle/0035_source_blobs_contract.sql")"
          fi
          if git cat-file -e "$APPROVED_HEAD:drizzle/0035_source_blobs_contract.sql" 2>/dev/null; then
            head_contract="$(git rev-parse "$APPROVED_HEAD:drizzle/0035_source_blobs_contract.sql")"
          fi
          if [[ -z "$base_contract" && -z "$head_contract" ]]; then
            # Non-contract PRs do not need the immutable source-blob gate.
            echo "required=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$base_contract" && "$base_contract" == "$head_contract" ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            # Any contract introduction, change, or deletion remains gated.
            test -n "$head_contract"
            test -f drizzle/0035_source_blobs_contract.sql
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download immutable source blob contract gate
        if: ${{ steps.source-blob-contract.outputs.required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BLOB_GATE_ARTIFACT_RUN_ID: ${{ inputs.source_blob_contract_gate_artifact_run_id }}
          SOURCE_BLOB_GATE_ARTIFACT_NAME: ${{ inputs.source_blob_contract_gate_artifact_name }}
          SOURCE_BLOB_GATE_MANIFEST: ${{ inputs.source_blob_contract_gate_manifest }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_BLOB_GATE_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_BLOB_GATE_ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$SOURCE_BLOB_GATE_MANIFEST" =~ ^[A-Za-z0-9._-]+\.json$ ]]
          install -d -m 0700 /tmp/devkh-source-blob-contract-gate
          gh run download "$SOURCE_BLOB_GATE_ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_BLOB_GATE_ARTIFACT_NAME" \
            --dir /tmp/devkh-source-blob-contract-gate
          test -f "/tmp/devkh-source-blob-contract-gate/$SOURCE_BLOB_GATE_MANIFEST"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Extract reviewed FK17 bootstrap verifier
        env:
          CURRENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$DEVKH_FK17_BOOTSTRAP_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$DEVKH_FK17_BOOTSTRAP_COMMIT^{commit}"
          git merge-base --is-ancestor "$DEVKH_FK17_BOOTSTRAP_COMMIT" HEAD
          test "$(git rev-parse "$DEVKH_FK17_BOOTSTRAP_COMMIT:.github/workflows/phase-merge.yml")" = \
            "$(git rev-parse "$CURRENT_WORKFLOW_SHA:.github/workflows/phase-merge.yml")"
          rm -rf /tmp/devkh-fk17-trusted
          install -d -m 0700 /tmp/devkh-fk17-trusted
          git archive "$DEVKH_FK17_BOOTSTRAP_COMMIT" | tar -x -C /tmp/devkh-fk17-trusted
      - name: Install reviewed FK17 verifier dependencies
        run: npm ci --ignore-scripts --prefix /tmp/devkh-fk17-trusted
      - name: Install recovery tooling
        run: sudo apt-get update && sudo apt-get install -y restic
      - name: Run reviewed FK17 verifier
        env:
          DEVKH_RELEASE_CANDIDATE_ROOT: ${{ github.workspace }}
          DEVKH_FK17_TRUSTED_BOOTSTRAP_COMMIT: ${{ vars.DEVKH_FK17_BOOTSTRAP_COMMIT }}
          DEVKH_FK17_CURRENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          DEVKH_FK17_CURRENT_WORKFLOW_PATH: .github/workflows/phase-merge.yml
        run: node /tmp/devkh-fk17-trusted/scripts/release-verify.mjs --scope container
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-merge-recovery-${{ github.run_id }}
          path: /tmp/devkh-recovery-evidence/
          if-no-files-found: error

  merge:
    needs: [verify, container-smoke]
    if: ${{ success() && inputs.user_approved && github.actor == github.repository_owner }}
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ inputs.pr_number }}
      APPROVED_HEAD: ${{ inputs.approved_head }}
      APPROVED_BASE: ${{ inputs.approved_base }}
      TRUSTED_BOOTSTRAP: ${{ vars.DEVKH_FK17_BOOTSTRAP_COMMIT }}
      CURRENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_base }}
          fetch-depth: 0
      - name: Validate approved pull request
        run: |
          set -euo pipefail
          [[ "$TRUSTED_BOOTSTRAP" =~ ^[a-f0-9]{40}$ ]] || { echo "invalid trusted bootstrap" >&2; exit 64; }
          git merge-base --is-ancestor "$TRUSTED_BOOTSTRAP" HEAD
          test "$(git rev-parse "$TRUSTED_BOOTSTRAP:.github/workflows/phase-merge.yml")" = \
            "$(git rev-parse "$CURRENT_WORKFLOW_SHA:.github/workflows/phase-merge.yml")"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "invalid pull request number" >&2; exit 64; }
          [[ "$APPROVED_HEAD" =~ ^[a-fA-F0-9]{40}$ ]] || { echo "invalid approved head" >&2; exit 64; }
          [[ "$APPROVED_BASE" =~ ^[a-fA-F0-9]{40}$ ]] || { echo "invalid approved base" >&2; exit 64; }
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "OPEN"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)" = "main"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefOid --jq .baseRefOid)" = "$APPROVED_BASE"
          test "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$APPROVED_HEAD"
          git merge-base --is-ancestor "$APPROVED_BASE" "$APPROVED_HEAD"
          test "$(git rev-parse HEAD)" = "$APPROVED_BASE"
      - name: Create and atomically push approved merge commit
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit "$APPROVED_HEAD" -m "Merge pull request #$PR_NUMBER"
          git push origin "HEAD:refs/heads/main" "--force-with-lease=refs/heads/main:$APPROVED_BASE"
          merge_commit="$(git rev-parse HEAD)"
          echo "commit=$merge_commit" >> "$GITHUB_OUTPUT"
          if git cat-file -e "$merge_commit:drizzle/0035_source_blobs_contract.sql" \
            && git cat-file -e "$merge_commit:docker/post-contract-ci-baseline.sql"; then
            echo "post_contract=true" >> "$GITHUB_OUTPUT"
          else
            echo "post_contract=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Issue exact-commit Phase Merge approval provenance
        if: ${{ steps.merge.outputs.post_contract == 'true' }}
        env:
          MERGE_COMMIT: ${{ steps.merge.outputs.commit }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          contract_blob="$(git rev-parse "$MERGE_COMMIT:drizzle/0035_source_blobs_contract.sql")"
          baseline_blob="$(git rev-parse "$MERGE_COMMIT:docker/post-contract-ci-baseline.sql")"
          workflow_blob="$(git rev-parse "$TRUSTED_BOOTSTRAP:.github/workflows/phase-merge.yml")"
          trusted_verifier_blob="$(git rev-parse "$TRUSTED_BOOTSTRAP:scripts/release-verify.mjs")"
          trusted_database_verifier_blob="$(git rev-parse "$TRUSTED_BOOTSTRAP:scripts/verify-post-contract-database.mjs")"
          issued_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          export contract_blob baseline_blob workflow_blob trusted_verifier_blob trusted_database_verifier_blob issued_at
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const document = {
              schemaVersion: 1,
              kind: "devkh-phase-merge-approval",
              repository: process.env.GITHUB_REPOSITORY,
              approvedCommit: process.env.MERGE_COMMIT,
              approvedHead: process.env.APPROVED_HEAD,
              approvedBase: process.env.APPROVED_BASE,
              contractBlob: process.env.contract_blob,
              baselineBlob: process.env.baseline_blob,
              workflowBlob: process.env.workflow_blob,
              trustedBootstrapCommit: process.env.TRUSTED_BOOTSTRAP,
              trustedVerifierBlob: process.env.trusted_verifier_blob,
              trustedDatabaseVerifierBlob: process.env.trusted_database_verifier_blob,
              workflowRunId: Number(process.env.WORKFLOW_RUN_ID),
              workflowRunAttempt: Number(process.env.WORKFLOW_RUN_ATTEMPT),
              issuedAt: process.env.issued_at
            };
            writeFileSync("phase-merge-approval.json", `${JSON.stringify(document)}\n`, { mode: 0o600, flag: "wx" });
          '
      - name: Upload exact-commit Phase Merge approval provenance
        if: ${{ steps.merge.outputs.post_contract == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase-merge-approval-${{ steps.merge.outputs.commit }}
          path: phase-merge-approval.json
          if-no-files-found: error
          retention-days: 90
