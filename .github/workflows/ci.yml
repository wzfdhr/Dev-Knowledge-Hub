name: ci

on:
  push:
    branches: [main, codex/mvp]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: devkh_test
          POSTGRES_USER: devkh
          POSTGRES_PASSWORD: devkh-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devkh -d devkh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://devkh:devkh-ci-password@127.0.0.1:5432/devkh_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run secrets:scan
      - run: npm run licenses:check
      - name: Verify isolated delivery configuration
        run: npm run delivery:verify
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run acceptance
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  container-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: devkh-container-password
      DEVKH_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DEVKH_SESSION_SECRET: container-smoke-session-secret-at-least-32-chars
      DEVKH_PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target runtime -t devkh:ci .
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start production Compose services
        run: docker compose up -d --build postgres app
      - name: Probe application health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes
