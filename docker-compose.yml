services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: dev_knowledge_hub
      POSTGRES_USER: devkh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devkh -d dev_knowledge_hub"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /var/lib/devkh
      DATABASE_URL: postgres://devkh:${POSTGRES_PASSWORD}@postgres:5432/dev_knowledge_hub
      DEVKH_MASTER_KEY: ${DEVKH_MASTER_KEY:?set DEVKH_MASTER_KEY}
      DEVKH_SESSION_SECRET: ${DEVKH_SESSION_SECRET:?set DEVKH_SESSION_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${DEVKH_DOMAIN:?set DEVKH_DOMAIN}}
      DEVKH_KNOWLEDGE_KERNEL_MODE: ${DEVKH_KNOWLEDGE_KERNEL_MODE:-legacy}
    volumes:
      - snapshot_data:/var/lib/devkh/snapshots
      - repository_mirrors:/var/lib/devkh/repos
      - uploaded_sources:/var/lib/devkh/uploads
      - artifact_data:/var/lib/devkh/artifacts
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DEVKH_DOMAIN: ${DEVKH_DOMAIN:?set DEVKH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

  integration:
    profiles: [test]
    build:
      context: .
      target: integration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://devkh:${POSTGRES_PASSWORD}@postgres:5432/devkh_test
    command: ["npm", "run", "test:integration"]

  e2e:
    profiles: [test]
    build:
      context: .
      target: e2e
    init: true
    command: ["npm", "run", "test:e2e"]

volumes:
  postgres_data:
  snapshot_data:
  repository_mirrors:
  uploaded_sources:
  artifact_data:
  caddy_data:
  caddy_config:
