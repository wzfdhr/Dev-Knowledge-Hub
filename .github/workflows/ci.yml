name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: devkh_test
          POSTGRES_USER: devkh
          POSTGRES_PASSWORD: devkh-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devkh -d devkh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://devkh:devkh-ci-password@127.0.0.1:5432/devkh_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:verify -- --scope verify
      - name: Validate frontend evaluation protocol (baseline; no analyzer quality gate)
        run: npm run evaluate:frontend
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Upload knowledge retrieval evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-retrieval-evaluation
          path: artifacts/knowledge-retrieval-evaluation.json
          if-no-files-found: error
      - name: Upload frontend knowledge evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-knowledge-evaluation
          path: artifacts/frontend-knowledge-evaluation.json
          if-no-files-found: error

  container-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: devkh-container-password
      DEVKH_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DEVKH_SESSION_SECRET: container-smoke-session-secret-at-least-32-chars
      PUBLIC_BASE_URL: https://hub.example.test
      DEVKH_PORT: 3000
      DEVKH_DOMAIN: hub.example.test
      ACME_EMAIL: ci@example.test
      COMPOSE_PROJECT_NAME: devkh-ci
      DEVKH_CONTAINER_SMOKE: "true"
      RECOVERY_EVIDENCE_DIR: /tmp/devkh-recovery-evidence
      RECOVERY_EVIDENCE_DEFER_FINALIZATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install recovery tooling
        run: sudo apt-get update && sudo apt-get install -y restic
      - run: npm run release:verify -- --scope container
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence
          path: /tmp/devkh-recovery-evidence/
          if-no-files-found: error
