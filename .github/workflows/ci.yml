name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: devkh_test
          POSTGRES_USER: devkh
          POSTGRES_PASSWORD: devkh-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devkh -d devkh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://devkh:devkh-ci-password@127.0.0.1:5432/devkh_test
      DEVKH_FK17_BOOTSTRAP_COMMIT: ${{ vars.DEVKH_FK17_BOOTSTRAP_COMMIT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run bootstrap-aware FK17 verifier
        env:
          CURRENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$DEVKH_FK17_BOOTSTRAP_COMMIT" ]]; then
            npm run release:verify -- --scope verify
            exit 0
          fi
          [[ "$DEVKH_FK17_BOOTSTRAP_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$DEVKH_FK17_BOOTSTRAP_COMMIT^{commit}"
          git merge-base --is-ancestor "$DEVKH_FK17_BOOTSTRAP_COMMIT" HEAD
          test "$(git rev-parse "$DEVKH_FK17_BOOTSTRAP_COMMIT:.github/workflows/ci.yml")" = \
            "$(git rev-parse "$CURRENT_WORKFLOW_SHA:.github/workflows/ci.yml")"
          rm -rf /tmp/devkh-fk17-trusted
          install -d -m 0700 /tmp/devkh-fk17-trusted
          git archive "$DEVKH_FK17_BOOTSTRAP_COMMIT" | tar -x -C /tmp/devkh-fk17-trusted
          npm ci --ignore-scripts --prefix /tmp/devkh-fk17-trusted
          DEVKH_RELEASE_CANDIDATE_ROOT="$GITHUB_WORKSPACE" \
          DEVKH_FK17_TRUSTED_BOOTSTRAP_COMMIT="$DEVKH_FK17_BOOTSTRAP_COMMIT" \
          DEVKH_FK17_CURRENT_WORKFLOW_SHA="$CURRENT_WORKFLOW_SHA" \
          DEVKH_FK17_CURRENT_WORKFLOW_PATH=.github/workflows/ci.yml \
          node /tmp/devkh-fk17-trusted/scripts/release-verify.mjs --scope verify
      - name: Validate frontend evaluation protocol (baseline; no analyzer quality gate)
        run: npm run evaluate:frontend
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Upload knowledge retrieval evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-retrieval-evaluation
          path: artifacts/knowledge-retrieval-evaluation.json
          if-no-files-found: error
      - name: Upload frontend knowledge evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-knowledge-evaluation
          path: artifacts/frontend-knowledge-evaluation.json
          if-no-files-found: error

  container-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: devkh-container-password
      DEVKH_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DEVKH_SESSION_SECRET: container-smoke-session-secret-at-least-32-chars
      PUBLIC_BASE_URL: https://hub.example.test
      DEVKH_PORT: 3000
      DEVKH_DOMAIN: hub.example.test
      ACME_EMAIL: ci@example.test
      COMPOSE_PROJECT_NAME: devkh-ci
      DEVKH_CONTAINER_SMOKE: "true"
      RECOVERY_EVIDENCE_DIR: /tmp/devkh-recovery-evidence
      RECOVERY_EVIDENCE_DEFER_FINALIZATION: "true"
      GITHUB_TOKEN: ${{ github.token }}
      DEVKH_FK17_BOOTSTRAP_COMMIT: ${{ vars.DEVKH_FK17_BOOTSTRAP_COMMIT }}
      DEVKH_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm ci
      - name: Install recovery tooling
        run: sudo apt-get update && sudo apt-get install -y restic
      - name: Run bootstrap-aware FK17 container verifier
        env:
          CURRENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ -z "$DEVKH_FK17_BOOTSTRAP_COMMIT" ]]; then
            npm run release:verify -- --scope container
            exit 0
          fi
          [[ "$DEVKH_FK17_BOOTSTRAP_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "$DEVKH_FK17_BOOTSTRAP_COMMIT^{commit}"
          git merge-base --is-ancestor "$DEVKH_FK17_BOOTSTRAP_COMMIT" HEAD
          test "$(git rev-parse "$DEVKH_FK17_BOOTSTRAP_COMMIT:.github/workflows/ci.yml")" = \
            "$(git rev-parse "$CURRENT_WORKFLOW_SHA:.github/workflows/ci.yml")"
          rm -rf /tmp/devkh-fk17-trusted
          install -d -m 0700 /tmp/devkh-fk17-trusted
          git archive "$DEVKH_FK17_BOOTSTRAP_COMMIT" | tar -x -C /tmp/devkh-fk17-trusted
          npm ci --ignore-scripts --prefix /tmp/devkh-fk17-trusted
          contract_probe_commit="${DEVKH_PULL_REQUEST_BASE_SHA:-HEAD}"
          if git cat-file -e "$contract_probe_commit:drizzle/0035_source_blobs_contract.sql"; then
            release_scope=runtime-container
          else
            release_scope=container
          fi
          DEVKH_RELEASE_CANDIDATE_ROOT="$GITHUB_WORKSPACE" \
          DEVKH_FK17_TRUSTED_BOOTSTRAP_COMMIT="$DEVKH_FK17_BOOTSTRAP_COMMIT" \
          DEVKH_FK17_CURRENT_WORKFLOW_SHA="$CURRENT_WORKFLOW_SHA" \
          DEVKH_FK17_CURRENT_WORKFLOW_PATH=.github/workflows/ci.yml \
          node /tmp/devkh-fk17-trusted/scripts/release-verify.mjs --scope "$release_scope"
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence
          path: /tmp/devkh-recovery-evidence/
          if-no-files-found: error
